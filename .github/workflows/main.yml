name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          unzip -q .github/workflows/ShoppingListApp_v4.zip

      - name: Check project
        run: |
          ls -la ShoppingListApp_v4
          ls -la ShoppingListApp_v4/app

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ShoppingListApp_v4/gradlew

      - name: Build debug APK
        working-directory: ShoppingListApp_v4
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShoppingList-debug-apk
          path: ShoppingListApp_v4/app/build/outputs/apk/debug/*.apk
