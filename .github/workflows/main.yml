name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: |
        unzip -o ShoppingListApp_v4.zip
        # اگر فایل‌ها داخل پوشه استخراج شدند، آن‌ها را به ریشه منتقل کن
        if [ -d "ShoppingListApp_v4" ]; then
          cp -r ShoppingListApp_v4/* .
        fi

    - name: Fix Java & Kotlin Target
      run: |
        sed -i '/android {/a \    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' app/build.gradle.kts

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShoppingListApp-Debug
        path: app/build/outputs/apk/debug/*.apk
concurrency: 
